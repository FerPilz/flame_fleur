<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#4D7404" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main stopwatch body -->
  <circle cx="12" cy="13.5" r="7.5" />
  <!-- Top button stem & crown -->
  <line x1="12" y1="6" x2="12" y2="3.5" />
  <line x1="10" y1="3.5" x2="14" y2="3.5" />
  <!-- Angled side button -->
  <line x1="17.3" y1="8.2" x2="19.1" y2="6.4" />
  <!-- Clock hands (90-degree corner variant matching native UI) -->
  <polyline points="12,9.5 12,13.5 14.5,13.5" />
</svg>